name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chaque deck a `download: true` : son build exporte le PDF proposé par
      # le bouton de téléchargement, ce qui demande Chromium.
      - run: npx playwright install --with-deps chromium

      # Le bouton de langue garde le numéro de slide : une version anglaise
      # décalée par rapport à la française bloque la publication.
      - run: npm run check:translations

      # Servi sous https://<org>.github.io/<repo>/ : l'accueil à la racine, les
      # trois jours sous .../<repo>/jourN/, la version anglaise sous .../en/.
      # La liste des decks est dans scripts/build-all.mjs.
      - name: Build
        run: npm run build:all -- /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
